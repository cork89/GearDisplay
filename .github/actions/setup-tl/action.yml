name: Set up Teal
description: Installs the standalone tl binary (embeds Lua 5.4) and puts it on PATH.
inputs:
  version:
    description: tl release to install
    default: "0.24.8"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        dir="$RUNNER_TEMP/tl-${{ inputs.version }}"
        mkdir -p "$dir"
        curl -sSfL "https://github.com/teal-language/tl/releases/download/v${{ inputs.version }}/tl-${{ inputs.version }}-linux-x86_64.tar.gz" \
          | tar xz -C "$dir" --strip-components=1
        echo "$dir" >> "$GITHUB_PATH"
    - shell: bash
      run: tl --version
