name: Types

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install Teal
        run: luarocks install tl 0.24.8

      - name: Generated declarations are up to date
        run: |
          sh types/gen/build.sh
          git diff --exit-code -- types/generated || {
            echo "::error::types/generated is stale; run types/gen/build.sh and commit the result"
            exit 1
          }

      - name: Declarations and tests type-check
        run: sh types/check.sh

      - name: Addon type-checks and compiles
        run: sh build.sh

      - name: Committed .lua matches tl gen output
        run: |
          git diff --exit-code -- "*.lua" || {
            echo "::error::compiled .lua is stale; run sh build.sh and commit the result"
            exit 1
          }
